{% extends 'base.html' %}{% block title %}Primeiro acesso{% endblock %}
{% block content %}
<div class="z-login z-card p-4">
  <h1 class="z-titulo">Primeiro acesso</h1><p class="z-sub">Crie o administrador do Zelo. Este endereço deixa de valer depois.</p>
  {% if erro %}<div class="alert alert-danger py-2">{{ erro }}</div>{% endif %}
  <form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label class="form-label">Nome</label><input class="form-control mb-2" name="nome" required>
    <label class="form-label">E-mail</label><input class="form-control mb-2" name="email" type="email" required>
    <label class="form-label">Senha (mín. 8)</label><input class="form-control mb-2" name="senha" type="password" required>
    <label class="form-label">Confirmar senha</label><input class="form-control mb-3" name="confirmacao" type="password" required>
    <button class="btn btn-zelo w-100">Criar administrador</button>
  </form>
</div>
{% endblock %}
